<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云塘图书馆座位决策器</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b56d4;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #2b3245;
    --muted: #8a93a6;
    --tag-bg: #eef1f8;
    --gold: #f5a623;
    --silver: #9aa5b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 640px; margin: 0 auto; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 4px 20px;
  }
  .logo { font-size: 20px; font-weight: 700; }
  .logo span { color: var(--primary); }
  .lang-btn {
    border: 1px solid #d6dbe8; background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: all .2s;
  }
  .lang-btn:hover { border-color: var(--primary); color: var(--primary); }

  .hero { text-align: center; margin-bottom: 24px; }
  .hero h1 { font-size: 24px; margin-bottom: 8px; }
  .hero p { color: var(--muted); font-size: 14px; }

  .question-card {
    background: var(--card); border-radius: 16px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(40, 55, 100, .06);
  }
  .question-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .question-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag {
    background: var(--tag-bg); border: 1.5px solid transparent; color: var(--text);
    border-radius: 999px; padding: 9px 16px; font-size: 14px; cursor: pointer;
    transition: all .15s; user-select: none;
  }
  .tag:active { transform: scale(.95); }
  .tag.active {
    background: var(--primary); color: #fff; border-color: var(--primary-dark);
    box-shadow: 0 3px 8px rgba(79, 110, 247, .35);
  }

  .submit-btn {
    width: 100%; border: none; background: var(--primary); color: #fff;
    font-size: 17px; font-weight: 600; padding: 15px; border-radius: 14px;
    cursor: pointer; margin: 8px 0 24px; transition: all .2s;
    box-shadow: 0 4px 14px rgba(79, 110, 247, .35);
  }
  .submit-btn:hover { background: var(--primary-dark); }

  .result { display: none; }
  .result.show { display: block; animation: fadeUp .4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .result-card {
    background: var(--card); border-radius: 16px; padding: 22px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(40, 55, 100, .06);
  }
  .zone-main { border-top: 4px solid var(--gold); }
  .zone-alt { border-top: 4px solid var(--silver); }
  .zone-badge { font-size: 13px; font-weight: 600; color: var(--muted); }
  .zone-name { font-size: 22px; font-weight: 700; margin: 6px 0 4px; }
  .zone-score {
    display: inline-block; background: #eef7ee; color: #2e9e4f;
    border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600;
    margin-bottom: 10px;
  }
  .zone-desc { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .zone-hours {
    display: inline-block; margin-left: 6px; background: #fff4e0; color: #b07a1e;
    border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 600;
  }

  .section-title { font-size: 15px; font-weight: 700; margin: 4px 0 12px; }
  .tip-list { list-style: none; }
  .tip-list li {
    font-size: 14px; line-height: 1.6; padding: 10px 12px; margin-bottom: 8px;
    background: #f7f9ff; border-radius: 10px; border-left: 3px solid var(--primary);
  }
  .notice {
    background: linear-gradient(135deg, #fff7e6, #fffdf5);
    border: 1px solid #f5dfa8; border-radius: 12px; padding: 14px 16px;
    font-size: 14px; line-height: 1.6; color: #7a5c14;
  }
  .reset-btn {
    width: 100%; border: 1px solid #d6dbe8; background: var(--card); color: var(--muted);
    font-size: 14px; padding: 12px; border-radius: 12px; cursor: pointer; margin-bottom: 30px;
  }
  .reset-btn:hover { color: var(--primary); border-color: var(--primary); }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0 24px; line-height: 1.7; }

  .zone-name, .zone-desc, .tip-list li, .notice { overflow-wrap: break-word; word-break: break-word; }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .hero h1 { font-size: 21px; }
    .hero p { font-size: 13px; }
    .logo { font-size: 17px; }
    .question-card, .result-card { padding: 16px; }
    .tag { font-size: 13px; padding: 8px 13px; }
    .zone-name { font-size: 19px; }
    .submit-btn { font-size: 16px; padding: 14px; }
    .zone-hours { display: inline-block; margin-top: 6px; margin-left: 0; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">📚 <span data-i18n="appName">云塘选座决策器</span></div>
    <button class="lang-btn" id="langBtn">EN</button>
  </header>

  <div class="hero">

    <div class="result-card zone-alt" id="altCard"></div>
    <div class="result-card">

      <ul class="tip-list" id="tipList"></ul>
    </div>
    <div class="notice" id="noticeBox" style="margin-bottom:14px;"></div>
    <button class="reset-btn" id="resetBtn" data-i18n="reset">重新选择</button>
  </div>

  <footer data-i18n="footer">楼层数据：长沙理工大学云塘校区图书馆 · 纯本地运行，无网络请求</footer>
</div>

/* ================= 状态与渲染 ================= */
let lang = 'zh';
const selected = new Set();
const $ = s => document.querySelector(s);
const t = () => I18N[lang];

function renderQuestions() {
  const box = $('#questions');
  box.innerHTML = '';
  t().questions.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.innerHTML = `<div class="question-title">${q.title}</div>
      <div class="question-sub">${q.sub}</div><div class="tags"></div>`;
    const tagBox = card.querySelector('.tags');
    q.tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'tag' + (selected.has(tag.id) ? ' active' : '');
      btn.textContent = tag.label;
      btn.onclick = () => {
        selected.has(tag.id) ? selected.delete(tag.id) : selected.add(tag.id);
        btn.classList.toggle('active');
      };
      tagBox.appendChild(btn);
    });
    box.appendChild(card);
  });
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t()[key]) el.textContent = t()[key];
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  $('#langBtn').textContent = lang === 'zh' ? 'EN' : '中文';
  renderQuestions();
  if ($('#result').classList.contains('show')) showResult(true);
}

/* ================= 打分逻辑 ================= */
function computeWeights() {
  const w = { quiet: 0, outlet: 0, talk: 0, crowd: 0 };
  selected.forEach(id => {
    const tw = TAG_WEIGHTS[id] || {};
    for (const k in tw) w[k] += tw[k];
  });
  return w;
}

function scoreZone(z, w) {
  let s = z.quiet * w.quiet + z.outlet * w.outlet
        + z.talk * w.talk + (3 - z.crowd) * w.crowd;
  if (selected.has('longstay') && z.lateNight) s += 4;   // 4楼阅览六室 23:00 关门
  if (selected.has('database') && z.type === 'lab') s += 5; // 查文献 → 数字资源阅览室
  return s;
}

function recommend() {
  const w = computeWeights();
  let pool = ZONES.slice();
  // 硬性过滤
  if (selected.has('discuss')) pool = pool.filter(z => z.talk >= 2);
  if (selected.has('outlet') && !selected.has('discuss')) {
    const f = pool.filter(z => z.outlet >= 1);
    if (f.length) pool = f;
  }
  // 周五下午：书库闭馆，仅自习室/阅览室开放
  if (isFridayAfternoon() && !selected.has('discuss')) {
    const f = pool.filter(z => z.type !== 'stack');
    if (f.length) pool = f;
  }
  const scored = pool.map(z => ({ z, score: scoreZone(z, w) }))
                     .sort((a, b) => b.score - a.score);
  const max = scored[0].score || 1;
  return scored.map(s => ({
    zone: s.z,
    pct: Math.max(40, Math.round(60 + 40 * s.score / max)),
  }));
}

/* ================= 结果渲染 ================= */
function zoneCardHTML(item, badge) {
  const zi = t().zones[item.zone.id];
  const hours = zi.hours ? `<span class="zone-hours">🕐 ${t().openTo} ${zi.hours}</span>` : '';
  return `<div class="zone-badge">${badge}</div>
    <div class="zone-name">${zi.name}</div>
    <div><span class="zone-score">${t().match} ${item.pct}%</span>${hours}</div>
    <div class="zone-desc" style="margin-top:8px;">${zi.desc}</div>`;
}

function buildTips(topZoneId) {
  const tips = [t().zoneTips[topZoneId]];
  for (const id of selected) {
    if (tips.length >= 3) break;
    const tip = t().tipsPool[id];
    if (tip && !tips.includes(tip)) tips.push(tip);
  }
  const fallback = Object.values(t().tipsPool);
  for (let i = 0; tips.length < 3 && i < fallback.length; i++) {
    if (!tips.includes(fallback[i])) tips.push(fallback[i]);
  }
  return tips.slice(0, 3);
}

function buildNotice() {
  const hit = t().notices.find(n => n.cond(selected));
  const n = lang === 'zh' ? ['1、', '2、'] : ['1. ', '2. '];
  return `<b>${t().noticeTitle}</b><br>${n[0]}${hit.text}<br>${n[1]}${t().fixedTip}`;
}

function showResult(skipScroll) {
  if (selected.size === 0) { alert(t().needSel); return; }
  const recs = recommend();
  $('#mainCard').innerHTML = zoneCardHTML(recs[0], t().first);
  $('#altCard').innerHTML = recs[1]
    ? zoneCardHTML(recs[1], t().alt)
    : `<div class="zone-desc">${t().onlyOne}</div>`;
  $('#tipList').innerHTML = buildTips(recs[0].zone.id).map(tip => `<li>${tip}</li>`).join('');
  $('#noticeBox').innerHTML = buildNotice();
  $('#result').classList.add('show');
  if (!skipScroll) $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ================= 事件绑定 ================= */
$('#submitBtn').onclick = () => showResult(false);
$('#resetBtn').onclick = () => {
  selected.clear();
  $('#result').classList.remove('show');
  renderQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
$('#langBtn').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  applyI18n();
};

applyI18n();
</script>
</body>
</html>
